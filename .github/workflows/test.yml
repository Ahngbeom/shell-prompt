name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck
        run: |
          shellcheck --version | head -2
          shellcheck -x prompt.sh themes/*.sh tests/run.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install zsh
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zsh

      - name: Versions
        run: |
          bash --version | head -1
          zsh --version
          git --version

      - name: Run tests in bash and zsh
        # An explicit ZSH makes a missing zsh fail the run instead of skipping the zsh suite.
        run: ZSH=/usr/bin/zsh tests/run.sh
